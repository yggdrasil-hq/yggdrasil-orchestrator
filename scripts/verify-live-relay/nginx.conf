# nginx for the two-replica live-relay verification (issue #32).
#
# Runs on the EXISTING `yggdrasil-dev_default` network, alongside the dev stack's
# Postgres. Deliberately does not publish a port: the verifier reaches it from
# inside the network, and publishing 80 would collide with the dev nginx.
#
# The directives under test — the `map` block, the two `Upgrade`/`Connection`
# proxy set-headers, and `proxy_read_timeout`/`proxy_send_timeout` at 3600s — are
# copied from `deploy/nginx/dev.conf` byte-for-byte. The upstream is NOT: the
# product fronts a single `api` service, and this fronts two replicas so the
# fan-out can be exercised. For the two checks that are about nginx itself
# (the idle socket, and the proxy path) that difference does not matter; for
# anything about the product's actual routing table, this file is not evidence.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream relay_api {
    # Two replicas behind one name: what makes "a socket on one replica, an event
    # written by the other" a realistic path rather than a direct call to a
    # chosen instance.
    server rv-api-a:3000 max_fails=0;
    server rv-api-b:3000 max_fails=0;
}

server {
    listen 80;

    # Same shape as the product's `/api/` block: trailing-slash proxy_pass strips
    # the prefix, so the upstream sees `/ws` rather than `/api/ws`.
    location /api/ {
        proxy_pass http://relay_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
